# ── ci-dev.yml ────────────────────────────────────────────────────────────────
# Gate-keep every pull request targeting the `dev` branch.
#
# Rules enforced:
#   • Backend: all unit-tests must pass when src/** or tests/** change.
#     Coverage must be ≥ 80% when src contains > 1 000 lines of Python,
#     otherwise ≥ 60%.
#   • Frontend: vitest must pass with ≥ 80% coverage when web-client/src/**
#     changes.
# ──────────────────────────────────────────────────────────────────────────────
name: CI – PR to dev

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "src/**"
      - "tests/**"
      - "web-client/src/**"

# One run per PR at a time.
concurrency:
  group: ci-dev-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Detect which areas of the codebase changed ────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
            frontend:
              - 'web-client/src/**'

  # ── Backend: Python tests & coverage ──────────────────────────────────────
  test-and-coverage:
    name: Backend Tests & Coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version tag is reachable
        run: |
          if ! git describe --tags --abbrev=0 2>/dev/null; then
            echo "::error::No reachable git tag found. Create an initial tag: git tag v0.1.0"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ── Count Python LOC in src/ ───────────────────────────────────────────
      - name: Count lines of code in src/
        id: loc
        run: |
          LOC=$(find src -name "*.py" -exec wc -l {} + 2>/dev/null \
                | tail -1 | awk '{print $1}')
          LOC=${LOC:-0}
          echo "loc=${LOC}" >> "$GITHUB_OUTPUT"
          echo "Lines of Python code in src/: ${LOC}"

      # ── Derive coverage threshold ──────────────────────────────────────────
      - name: Determine coverage threshold
        id: threshold
        run: |
          if [ "${{ steps.loc.outputs.loc }}" -gt 1000 ]; then
            echo "threshold=80" >> "$GITHUB_OUTPUT"
            echo "Threshold: 80% (src LOC > 1 000)"
          else
            echo "threshold=60" >> "$GITHUB_OUTPUT"
            echo "Threshold: 60% (src LOC ≤ 1 000)"
          fi

      # ── Run pytest (options from pyproject.toml) ───────────────────────────
      - name: Run tests
        run: pytest

      # ── Enforce threshold ──────────────────────────────────────────────────
      - name: Check coverage threshold
        run: |
          THRESHOLD=${{ steps.threshold.outputs.threshold }}
          COVERAGE=$(python - <<'EOF'
          import xml.etree.ElementTree as ET
          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          print(round(float(root.attrib["line-rate"]) * 100))
          EOF
          )
          echo "Coverage : ${COVERAGE}%"
          echo "Required : ${THRESHOLD}%"
          if [ "${COVERAGE}" -lt "${THRESHOLD}" ]; then
            echo "::error::Coverage ${COVERAGE}% is below the required ${THRESHOLD}%."
            exit 1
          fi
          echo "Coverage check passed ✓"

      # ── Upload coverage report as artefact ────────────────────────────────
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 7

  # ── Frontend: Vitest unit tests & 80 % coverage gate ─────────────────────
  frontend-test:
    name: Frontend Tests & Coverage
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-client/package-lock.json

      - name: Install dependencies
        working-directory: web-client
        run: npm ci

      - name: Run tests with coverage
        working-directory: web-client
        run: npm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: web-client/coverage/
          retention-days: 7

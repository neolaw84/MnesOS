# ── release.yml ───────────────────────────────────────────────────────────────
# Triggered when a PR from `dev` is **merged** into `main`.
#
# Steps performed:
#   1. Determine bump type from PR labels (bump:major / bump:minor / bump:patch).
#   2. Calculate the next semver tag from the most recent git tag.
#   3. Create and push the new version tag (before building so setuptools-scm
#      embeds the correct version).
#   4. Build wheel (.whl) and source distribution (.tar.gz).
#   5. Create a GitHub Release and attach both distribution files.
#   6. Publish the package to PyPI via Trusted Publisher / OIDC.
# ──────────────────────────────────────────────────────────────────────────────
name: Release – merge to main

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  build-and-release:
    name: Build, release & publish
    # Only run when the PR was actually merged (not just closed).
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the version tag and create GitHub Releases
      id-token: write   # needed for OIDC / Trusted Publisher on PyPI

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      # ── Build the React frontend and copy assets into the Python package ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-client/package-lock.json

      - name: Install frontend dependencies
        working-directory: web-client
        run: npm ci

      - name: Build frontend (copies assets to src/MnesOS/api/static/)
        working-directory: web-client
        run: npm run build

      - name: Verify frontend assets were bundled into the Python package
        run: |
          if [ ! -d "src/MnesOS/api/static" ] || [ -z "$(ls -A src/MnesOS/api/static 2>/dev/null)" ]; then
            echo "::error::src/MnesOS/api/static is missing or empty after frontend build."
            exit 1
          fi
          echo "Frontend assets present in src/MnesOS/api/static ✓"

      # ── Determine bump type from PR labels ────────────────────────────────
      - name: Determine bump type
        id: bump
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"bump:major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"bump:patch"'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=minor" >> "$GITHUB_OUTPUT"
          fi
          echo "Bump type: $(grep type= "$GITHUB_OUTPUT" | cut -d= -f2)"

      # ── Calculate next version from latest git tag ────────────────────────
      - name: Calculate next version
        id: version
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          # Strip leading 'v'
          CURRENT="${CURRENT#v}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          BUMP_TYPE=${{ steps.bump.outputs.type }}
          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP_TYPE" = "patch" ]; then
            PATCH=$((PATCH + 1))
          else
            MINOR=$((MINOR + 1)); PATCH=0
          fi
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${TAG}"

      # ── Create and push the version tag ───────────────────────────────────
      # This must happen BEFORE `python -m build` so setuptools-scm picks it up.
      - name: Create version tag
        run: |
          TAG=${{ steps.version.outputs.tag }}
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      # ── Build distributions ────────────────────────────────────────────────
      - name: Build wheel and sdist
        run: python -m build

      - name: List built artefacts
        run: ls -lh dist/

      # ── Create GitHub Release ──────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*

      # ── Publish to PyPI (Trusted Publisher / OIDC) ────────────────────────
      # Before using this step, configure a Trusted Publisher in your PyPI
      # project settings:
      #   Owner       : <your GitHub username / org>
      #   Repository  : <your repo name>
      #   Workflow    : release.yml
      #   Environment : (leave blank, or set to "pypi" and create that env below)
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

version: "1.0"

# ---------------------------------------------------------------------------
# State Schema
# ---------------------------------------------------------------------------
state_schema:
  player_hp:           { type: int,    default: 100, min: 0, max: 100, visibility: public }
  player_name:         { type: string, default: "Hacker",              visibility: public }
  player_credits:      { type: int,    default: 50,  min: 0,           visibility: public }
  player_skill_level:  { type: int,    default: 1,   min: 1, max: 5,   visibility: private }

  terminal_locked:        { type: bool,   default: true,  visibility: public }
  terminal_attempts:      { type: int,    default: 0,     visibility: public }
  terminal_reward_tier:   { type: string, default: "none", visibility: private }
  terminal_hack_interacted: { type: bool, default: false, visibility: private }

  world_current_room:  { type: string, default: "entry_corridor", visibility: public }
  world_alarm_active:  { type: bool,   default: false,             visibility: public }

  _pending_interaction: { type: dict, default: {}, visibility: private }

# ---------------------------------------------------------------------------
# Events
# ---------------------------------------------------------------------------
events:

  # ---------- Initiate the Lights-Out hacking puzzle ----------
  initiate_hack:
    steps:
      - action: branch
        conditions:
          - if: "@ state.terminal_hack_interacted == true"
            steps:
              - action: set
                var: state._pending_interaction
                value: {}
              - action: note
                message: "[SYSTEM LOG: Terminal security has engaged a permanent lockout after the previous attempt.]"
          - if: "@ state.terminal_locked == false"
            steps:
              - action: set
                var: state._pending_interaction
                value: {}
              - action: note
                message: "[SYSTEM LOG: Terminal is already unlocked. No need to hack.]"
          - else: true
            steps:
              - action: set
                var: state.terminal_hack_interacted
                value: true
              - action: mutate
                var: state.terminal_attempts
                op: add
                value: 1
              - action: set
                var: state._pending_interaction
                value:
                  interaction_type: "minigame"
                  minigame_id: "lights_out"
                  resolver_event: "resolve_hack"
                  config:
                    difficulty:
                      grid_size: 4
                      max_moves: 20
                      scramble_depth: 10
                    assets:
                      icon_on: "🔴"
                      icon_off: "⬜"
                    narrative_hooks:
                      on_combo: "Circuit breakers are tripping one by one."
                      on_near_miss: "Sparks fly as you nearly short the panel."
              - action: note
                message: "[SYSTEM LOG: Hack terminal mini-game triggered. Attempt #{state.terminal_attempts}.]"

  # ---------- Resolver — called by the Input Router with mini-game result ----------
  resolve_hack:
    inputs: ["status", "metrics", "minigame_specific_data"]
    steps:
      - action: branch
        conditions:
          - if: "@ inputs.status == 'completed'"
            steps:
              - action: set
                var: state.terminal_locked
                value: false
              - action: mutate
                var: state.player_credits
                op: add
                value: 100
              - action: set
                var: state.terminal_reward_tier
                value: "standard"
              - action: note
                message: "[SYSTEM LOG: Terminal unlocked! +100 credits. Moves used: {inputs.minigame_specific_data.moves_made}]"
          - if: "@ inputs.status == 'failed'"
            steps:
              - action: set
                var: state.world_alarm_active
                value: true
              - action: mutate
                var: state.player_hp
                op: sub
                value: 15
              - action: note
                message: "[SYSTEM LOG: Hack failed. Alarm triggered! HP -{inputs.minigame_specific_data.grid_remaining} penalty. Player HP: {state.player_hp}]"
          - else: true
            steps:
              - action: note
                message: "[SYSTEM LOG: Hack aborted by player. Terminal still locked.]"

  # ---------- Helper events ----------
  move_to_server_room:
    steps:
      - action: branch
        conditions:
          - if: "@ state.terminal_locked == true"
            steps:
              - action: note
                message: "[SYSTEM LOG: Server room door requires an unlocked terminal. Access denied.]"
          - else: true
            steps:
              - action: set
                var: state.world_current_room
                value: "server_room"
              - action: note
                message: "[SYSTEM LOG: Player entered the server room.]"

  disable_alarm:
    steps:
      - action: set
        var: state.world_alarm_active
        value: false
      - action: note
        message: "[SYSTEM LOG: Alarm disabled.]"

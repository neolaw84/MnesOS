site_name: "MnesOS"
site_description: "MnesOS is fully Agentic RPG Game Engine."
site_author: "neolaw84"
site_url: "https://neolaw84.github.io/MnesOS/"
repo_name: "neolaw84/MnesOS"
repo_url: "https://github.com/neolaw84/MnesOS"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Cartridge Guide: cartridge-guide.md
  - Reference:
      - YARE Specification: yare-specification.md
      - API: api.md
  - Guides:
      - Play-Testing Guide (Linux/macOS): play-test.md
      - Play-Testing Guide (Windows): play-test-win.md
      - Advanced Combat Mechanics: guides/advanced-combat-mechanics.md
  - Design Tracking:
      - Architecture Analysis: design/0001-three-node-graph-architecture.md
      - State and Turn Flow: design/0002-state-and-turn-flow.md
      - Separate NPC Brain: design/separate-npc-brain.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets
  - toc:
      permalink: true

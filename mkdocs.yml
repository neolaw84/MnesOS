site_name: "MnesOS"
site_description: "MnesOS is fully Agentic RPG Game Engine."
site_author: "neolaw84"
site_url: "https://neolaw84.github.io/MnesOS/"
repo_name: "neolaw84/MnesOS"
repo_url: "https://github.com/neolaw84/MnesOS"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Guides:
      - Player Guide: guides/player-guide.md
      - Cartridge Developer Guide: guides/cartridge-developer-guide.md
  - Core Architecture:
      - Architecture: design/architecture.md
      - Philosophy: design/philosophy.md
      - YARE Specification: yare-specification.md
      - API Reference: api.md
  - Development:
      - Directory Map: development/directory-map.md
      - CI/CD & Build Instructions: development/ci-cd.md
  - AI Context:
      - AI Knowledge Map: ai-index.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets
  - toc:
      permalink: true

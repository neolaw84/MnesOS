[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MnesOS"
dynamic = ["version"]
description = "MnesOS is fully Agentic RPG Game Engine."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "neolaw84", email = "neolaw@gmail.com"},
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "langgraph>=1.1.0,<1.3",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/neolaw84/MnesOS"
Documentation = "https://neolaw84.github.io/MnesOS/"
Issues = "https://github.com/neolaw84/MnesOS/issues"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "python-multipart>=0.0.22",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
    "ipywidgets>=8.0",
    # Include all api dependencies for testing
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "python-multipart>=0.0.22",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
]

[project.scripts]
mnesos-ingest-cartridges = "MnesOS.utils.ingest_cartridges:main"
mnesos-create-creator = "MnesOS.utils.create_creator:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"MnesOS.api" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=xml --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.setuptools_scm]
version_file = "src/MnesOS/_version.py"
